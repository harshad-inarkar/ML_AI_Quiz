<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Resources</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { font-family: 'Roboto', Arial, sans-serif; background-color: #f0ebf8; color: #202124; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .page-container { max-width: 640px; width: 100%; }
        
        /* Added position: relative to allow absolute positioning of the view count */
        .header-card { position: relative; background-color: #fff; border-top: 10px solid #673ab7; padding: 24px; border-radius: 8px; margin-bottom: 24px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15); }
        .header-card h1 { margin: 0 0 10px 0; font-size: 32px; font-weight: 400; padding-right: 60px; }
        .header-card p { margin: 0; color: #5f6368; font-size: 14px; }
        
        /* View count styling */
        .view-count { position: absolute; top: 12px; right: 16px; font-size: 12px; color: #5f6368; font-weight: 500; }
        
        .nav-link { display:inline-block; margin-bottom: 20px; color: #673ab7; text-decoration: none; font-weight: 500; }
        
        .resource-card { background: #fff; padding: 24px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15); border-left: 8px solid #673ab7; }
        .resource-card h2 { margin: 0 0 16px 0; font-size: 20px; color: #202124; font-weight: 500; }
        
        .resource-list { list-style-type: none; padding: 0; margin: 0; }
        .resource-list li { margin-bottom: 16px; font-size: 15px; line-height: 1.4; }
        .resource-list a { color: #1a73e8; text-decoration: none; font-weight: 500; word-break: break-all; }
        .resource-list a:hover { text-decoration: underline; }
        
        #status-msg { text-align: center; color: #5f6368; padding: 40px; font-size: 18px; }
        
        .error-box { background-color: #fce8e6; color: #c5221f; padding: 16px; border-radius: 8px; border-left: 4px solid #c5221f; margin-bottom: 24px; font-size: 14px; display: none; }
    </style>

    <!-- Added Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="page-container">
    <a href="index.html" class="nav-link">&larr; Back to Portal</a>
    
    <div class="header-card">
        <!-- View Counter Display -->
        <div class="view-count">Views: <span id="visitor-count">...</span></div>
        
        <h1>Study Resources</h1>
        <p>Review the materials below to assist with your learning.</p>
    </div>

    <div id="status-msg">Fetching resources...</div>
    <div id="error-container" class="error-box"></div>
    <div id="resources-container"></div>
</div>

<script>
    // --- 1. INITIALIZE FIREBASE FOR VIEW TRACKING ---
    const firebaseConfig = {
      apiKey: "AIzaSyBugi9hxa8hsMZ_MZHUrEguA_k-tMtPtaQ",
      authDomain: "quizportal-d0eff.firebaseapp.com",
      databaseURL: "https://quizportal-d0eff-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quizportal-d0eff",
      storageBucket: "quizportal-d0eff.firebasestorage.app",
      messagingSenderId: "545650564737",
      appId: "1:545650564737:web:feb792a331ce365976f780"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const resCountRef = db.ref('portal_views/resources');
    const localResKey = 'visited_resources_page';

    if (!localStorage.getItem(localResKey)) {
        resCountRef.set(firebase.database.ServerValue.increment(1));
        localStorage.setItem(localResKey, 'true');
    }

    resCountRef.on('value', (snapshot) => {
        document.getElementById('visitor-count').innerText = snapshot.val() || 0;
    });
    // ------------------------------------------------

    // --- 2. FETCH AND RENDER RESOURCES ---
    const urlParams = new URLSearchParams(window.location.search);
    const keysParam = urlParams.get('keys');
    
    const requestedKeys = keysParam ? keysParam.split(',').map(k => k.trim()) : null;

    fetch('data/resources_config.json')
        .then(async response => {
            if (!response.ok) throw new Error(`HTTP Error ${response.status}: The file data/resources_config.json could not be found.`);
            try {
                return await response.json();
            } catch (e) {
                throw new Error("JSON Syntax Error: Please check data/resources_config.json for missing quotes or trailing commas.");
            }
        })
        .then(data => {
            document.getElementById('status-msg').style.display = 'none';
            const container = document.getElementById('resources-container');
            
            const keysToRender = requestedKeys || Object.keys(data);
            
            if (keysToRender.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #5f6368;">No resources found.</p>`;
                return;
            }

            keysToRender.forEach(key => {
                const group = data[key];
                if (!group) return; 

                const card = document.createElement('div');
                card.className = 'resource-card';
                
                let listHtml = '<ul class="resource-list">';
                
                group.resources.forEach(res => {
                    let itemHtml = '';
                    let linkArea = '';
                    
                    // Determine how to format the link/desc part
                    if (res.desc && res.link) {
                        linkArea = `<a href="${res.link}" target="_blank" rel="noopener noreferrer">${res.desc}</a>`;
                    } else if (res.link) {
                        linkArea = `<a href="${res.link}" target="_blank" rel="noopener noreferrer">${res.link}</a>`;
                    } else if (res.desc) {
                        linkArea = `<span>${res.desc}</span>`;
                    }
                    
                    // Combine Title and the Link Area
                    if (res.title && linkArea) {
                        itemHtml = `<strong>${res.title}</strong> : ${linkArea}`;
                    } else if (res.title) {
                        // Only title is present
                        itemHtml = `<strong>${res.title}</strong>`;
                    } else if (linkArea) {
                        // No title, just link area
                        itemHtml = linkArea;
                    }
                    
                    if (itemHtml) {
                        listHtml += `<li>${itemHtml}</li>`;
                    }
                });
                
                listHtml += '</ul>';

                card.innerHTML = `
                    <h2>${group.title}</h2>
                    ${listHtml}
                `;
                container.appendChild(card);
            });
            
            if (container.innerHTML.trim() === '') {
                container.innerHTML = `<p style="text-align: center; color: #5f6368;">Requested resources could not be found.</p>`;
            }
        })
        .catch(error => {
            document.getElementById('status-msg').style.display = 'none';
            const errorBox = document.getElementById('error-container');
            errorBox.style.display = 'block';
            errorBox.innerHTML = `<strong>Error Loading Resources:</strong><br>${error.message}`;
            console.error(error);
        });
</script>

</body>
</html>
