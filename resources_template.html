<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Resources</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-900: #03181a;
            --surface: #0a3033;
            --surface-border: #144e50;
            --turquoise: #2dd4bf;
            --turquoise-soft: #5eead4;
            --peacock: #0ea5b7;
            --teal-mid: #0d9488;
            --text-primary: #eafffb;
            --text-secondary: #8fb8b4;
            --red-bg: rgba(248, 113, 113, 0.12);
            --red-text: #fca5a5;
            --red-border: #f87171;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: radial-gradient(circle at 15% 0%, #0b3d3f 0%, var(--bg-900) 55%, #010e0f 100%);
            color: var(--text-primary);
            margin: 0;
            padding: 24px 20px 48px;
            display: flex;
            justify-content: center;
        }

        .page-container { max-width: 640px; width: 100%; }

        .header-card {
            position: relative;
            background-color: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 30px 28px 26px;
            border-radius: 20px;
            margin-bottom: 26px;
            box-shadow: 0 0 0 1px rgba(45, 212, 191, 0.04), 0 20px 45px -20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--teal-mid), var(--turquoise), var(--peacock));
        }

        .header-card h1 {
            margin: 8px 0 10px 0;
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            padding-right: 70px;
            letter-spacing: -0.02em;
        }

        .header-card p { margin: 0; color: var(--text-secondary); font-size: 14px; }

        .view-count {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 12px;
            color: var(--turquoise-soft);
            font-weight: 600;
            background: rgba(45, 212, 191, 0.08);
            border: 1px solid var(--surface-border);
            padding: 4px 12px;
            border-radius: 999px;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--turquoise-soft);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .nav-link:hover { color: #fff; }

        .resource-card {
            background: var(--surface);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 18px;
            border: 1px solid var(--surface-border);
            border-left: 4px solid var(--turquoise);
            box-shadow: 0 12px 30px -18px rgba(0, 0, 0, 0.7);
        }

        .resource-card h2 {
            margin: 0 0 16px 0;
            font-family: 'Poppins', sans-serif;
            font-size: 19px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .resource-list { margin: 0; padding-left: 22px; }
        .resource-list li { margin-bottom: 14px; font-size: 15px; line-height: 1.5; color: var(--text-primary); }
        .resource-list a {
            color: var(--turquoise-soft);
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
        }
        .resource-list a:hover { text-decoration: underline; color: var(--turquoise); }

        #status-msg { text-align: center; color: var(--text-secondary); padding: 40px; font-size: 17px; }

        .error-box {
            background-color: var(--red-bg);
            color: var(--red-text);
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid var(--red-border);
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
        }
    </style>

    <!-- Added Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="page-container">
    <a href="index.html" class="nav-link">&larr; Back to Portal</a>
    
    <div class="header-card">
        <!-- View Counter Display -->
        <div class="view-count">Views: <span id="visitor-count">...</span></div>
        
        <h1>Study Resources</h1>
        <p>Review the materials below to assist with your learning.</p>
    </div>

    <div id="status-msg">Fetching resources...</div>
    <div id="error-container" class="error-box"></div>
    <div id="resources-container"></div>
</div>

<script>
    // --- 1. INITIALIZE FIREBASE FOR VIEW TRACKING ---
    const firebaseConfig = {
      apiKey: "AIzaSyBugi9hxa8hsMZ_MZHUrEguA_k-tMtPtaQ",
      authDomain: "quizportal-d0eff.firebaseapp.com",
      databaseURL: "https://quizportal-d0eff-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quizportal-d0eff",
      storageBucket: "quizportal-d0eff.firebasestorage.app",
      messagingSenderId: "545650564737",
      appId: "1:545650564737:web:feb792a331ce365976f780"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const resCountRef = db.ref('portal_views/resources');
    const localResKey = 'visited_resources_page';

    if (!localStorage.getItem(localResKey)) {
        resCountRef.set(firebase.database.ServerValue.increment(1));
        localStorage.setItem(localResKey, 'true');
    }

    resCountRef.on('value', (snapshot) => {
        document.getElementById('visitor-count').innerText = snapshot.val() || 0;
    });
    // ------------------------------------------------

    // --- 2. FETCH AND RENDER RESOURCES ---
    const urlParams = new URLSearchParams(window.location.search);
    const keysParam = urlParams.get('keys');
    
    const requestedKeys = keysParam ? keysParam.split(',').map(k => k.trim()) : null;

 db.ref('configs/resources').once('value')
        .then(snapshot => {
            if (!snapshot.exists()) throw new Error("Resources config not found in Firebase.");
            const data = snapshot.val();
            
            document.getElementById('status-msg').style.display = 'none';
            const container = document.getElementById('resources-container');
            
            const keysToRender = requestedKeys || Object.keys(data);
            
            if (keysToRender.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #8fb8b4;">No resources found.</p>`;
                return;
            }

            keysToRender.forEach(key => {
                const group = data[key];
                if (!group) return; 

                const card = document.createElement('div');
                card.className = 'resource-card';
                
                let listHtml = '<ul class="resource-list">';
                
                group.resources.forEach(res => {
                    let itemHtml = '';
                    let linkArea = '';
                    
                    if (res.desc && res.link) {
                        linkArea = `<a href="${res.link}" target="_blank" rel="noopener noreferrer">${res.desc}</a>`;
                    } else if (res.link) {
                        linkArea = `<a href="${res.link}" target="_blank" rel="noopener noreferrer">${res.link}</a>`;
                    } else if (res.desc) {
                        linkArea = `<span>${res.desc}</span>`;
                    }
                    
                    if (res.title && linkArea) {
                        itemHtml = `<strong>${res.title}</strong> : ${linkArea}`;
                    } else if (res.title) {
                        itemHtml = `<strong>${res.title}</strong>`;
                    } else if (linkArea) {
                        itemHtml = linkArea;
                    }
                    
                    if (itemHtml) {
                        listHtml += `<li>${itemHtml}</li>`;
                    }
                });
                
                listHtml += '</ul>';

                card.innerHTML = `
                    <h2>${key}. ${group.title}</h2>
                    ${listHtml}
                `;
                container.appendChild(card);
            });
            
            if (container.innerHTML.trim() === '') {
                container.innerHTML = `<p style="text-align: center; color: #8fb8b4;">Requested resources could not be found.</p>`;
            }
        })
        .catch(error => {
            document.getElementById('status-msg').style.display = 'none';
            const errorBox = document.getElementById('error-container');
            errorBox.style.display = 'block';
            errorBox.innerHTML = `<strong>Error Loading Resources:</strong><br>${error.message}`;
            console.error(error);
        });
</script>

</body>
</html>
