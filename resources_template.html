<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Resources</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500&display=swap');

        :root {
            --bg-main: #000000;
            --surface: #0b1517;
            --surface-alt: #132225;
            --surface-border: #1a2f33;
            --primary-accent: #4a7c7b;
            --secondary-accent: #6da4a3;
            --text-primary: #cbd5e1; 
            --text-heading: #e2e8f0; 
            --text-secondary: #94a3b8; 
            
            --red-bg: rgba(153, 56, 73, 0.15);
            --red-text: #e28591;
            --red-border: #993849;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 24px 20px 48px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .page-container { max-width: 640px; width: 100%; }

        .header-card {
            position: relative;
            background-color: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 30px 28px 26px;
            border-radius: 20px;
            margin-bottom: 26px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(109, 164, 163, 0.03);
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--secondary-accent), var(--primary-accent));
        }

        .header-card h1 {
            margin: 8px 0 10px 0;
            font-family: 'Poppins', sans-serif;
            font-size: 26px;
            font-weight: 500;
            color: var(--text-heading);
            padding-right: 70px;
            letter-spacing: -0.02em;
        }

        .header-card p { margin: 0; color: var(--text-secondary); font-size: 14px; font-weight: 400; line-height: 1.5; }

        .view-count {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 11px;
            color: var(--secondary-accent);
            font-weight: 500;
            background: rgba(109, 164, 163, 0.1);
            border: 1px solid var(--surface-border);
            padding: 4px 12px;
            border-radius: 999px;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--secondary-accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--text-heading); }

        .resource-card {
            background: var(--surface);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 18px;
            border: 1px solid var(--surface-border);
            border-left: 4px solid var(--primary-accent);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .resource-card h2 {
            margin: 0 0 16px 0;
            font-family: 'Poppins', sans-serif;
            font-size: 17px;
            color: var(--text-heading);
            font-weight: 500;
        }

        .resource-list { margin: 0; padding-left: 22px; }
        .resource-list li { margin-bottom: 14px; font-size: 14px; line-height: 1.6; color: var(--text-primary); }
        
        /* Subtle Link Indicators */
        .resource-list a {
            color: var(--secondary-accent);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
            text-decoration-color: rgba(109, 164, 163, 0.3); /* Subtle semi-transparent underline */
            font-weight: 500;
            word-break: break-all;
            transition: all 0.2s ease;
        }
        .resource-list a:hover { 
            text-decoration-color: var(--secondary-accent); /* Solid underline on hover */
            opacity: 0.9; 
        }

        #status-msg { text-align: center; color: var(--text-secondary); padding: 40px; font-size: 15px; }

        .error-box {
            background-color: var(--red-bg);
            color: var(--red-text);
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid var(--red-border);
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="page-container">
    <a href="index.html" class="nav-link">&larr; Back to Portal</a>
    
    <div class="header-card">
        <div class="view-count">Views: <span id="visitor-count">...</span></div>
        
        <h1>Study Resources</h1>
        <p>Review the materials below to assist with your learning.</p>
    </div>

    <div id="status-msg">Fetching resources...</div>
    <div id="error-container" class="error-box"></div>
    <div id="resources-container"></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBugi9hxa8hsMZ_MZHUrEguA_k-tMtPtaQ",
      authDomain: "quizportal-d0eff.firebaseapp.com",
      databaseURL: "https://quizportal-d0eff-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quizportal-d0eff",
      storageBucket: "quizportal-d0eff.firebasestorage.app",
      messagingSenderId: "545650564737",
      appId: "1:545650564737:web:feb792a331ce365976f780"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const resCountRef = db.ref('portal_views/resources');
    const localResKey = 'visited_resources_page';

    if (!localStorage.getItem(localResKey)) {
        resCountRef.set(firebase.database.ServerValue.increment(1));
        localStorage.setItem(localResKey, 'true');
    }

    resCountRef.on('value', (snapshot) => {
        document.getElementById('visitor-count').innerText = snapshot.val() || 0;
    });

    const urlParams = new URLSearchParams(window.location.search);
    const keysParam = urlParams.get('keys');
    
    const requestedKeys = keysParam ? keysParam.split(',').map(k => k.trim()) : null;

    db.ref('configs/resources').once('value')
        .then(snapshot => {
            if (!snapshot.exists()) throw new Error("Resources config not found in Firebase.");
            const data = snapshot.val();
            
            document.getElementById('status-msg').style.display = 'none';
            const container = document.getElementById('resources-container');
            
            const keysToRender = requestedKeys || Object.keys(data);
            
            if (keysToRender.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-secondary);">No resources found.</p>`;
                return;
            }

            keysToRender.forEach(key => {
                const group = data[key];
                if (!group) return; 

                const card = document.createElement('div');
                card.className = 'resource-card';
                
                let listHtml = '<ul class="resource-list">';
                
                group.resources.forEach(res => {
                    let itemHtml = '';
                    let linkArea = '';
                    
                    if (res.desc && res.link) {
                        linkArea = `<a href="${res.link}" target="_blank" rel="noopener noreferrer">${res.desc}</a>`;
                    } else if (res.link) {
                        linkArea = `<a href="${res.link}" target="_blank" rel="noopener noreferrer">${res.link}</a>`;
                    } else if (res.desc) {
                        linkArea = `<span>${res.desc}</span>`;
                    }
                    
                    if (res.title && linkArea) {
                        itemHtml = `<strong>${res.title}</strong> : ${linkArea}`;
                    } else if (res.title) {
                        itemHtml = `<strong>${res.title}</strong>`;
                    } else if (linkArea) {
                        itemHtml = linkArea;
                    }
                    
                    if (itemHtml) {
                        listHtml += `<li>${itemHtml}</li>`;
                    }
                });
                
                listHtml += '</ul>';

                card.innerHTML = `
                    <h2>${key}. ${group.title}</h2>
                    ${listHtml}
                `;
                container.appendChild(card);
            });
            
            if (container.innerHTML.trim() === '') {
                container.innerHTML = `<p style="text-align: center; color: var(--text-secondary);">Requested resources could not be found.</p>`;
            }
        })
        .catch(error => {
            document.getElementById('status-msg').style.display = 'none';
            const errorBox = document.getElementById('error-container');
            errorBox.style.display = 'block';
            errorBox.innerHTML = `<strong>Error Loading Resources:</strong><br>${error.message}`;
            console.error(error);
        });
</script>

</body>
</html>
