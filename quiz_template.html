<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { font-family: 'Roboto', Arial, sans-serif; background-color: #f0ebf8; color: #202124; margin: 0; padding: 20px; }
        .form-container { max-width: 640px; margin: 0 auto; }
        .header-card { position: relative; background-color: #fff; border-top: 10px solid #673ab7; padding: 24px; border-radius: 8px; margin-bottom: 24px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15); }
        .header-card h1 { margin: 0 0 10px 0; font-size: 32px; font-weight: 400; padding-right: 60px; }
        .header-card p { margin: 0; color: #5f6368; font-size: 14px; }
        .view-count { position: absolute; top: 12px; right: 16px; font-size: 12px; color: #5f6368; font-weight: 500; }
        
        .nav-link { display:inline-block; margin-bottom: 20px; color: #673ab7; text-decoration: none; font-weight: 500; }
        .question-card { background: #fff; padding: 24px; border-radius: 8px; margin-bottom: 24px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15); }
        .question-text { font-size: 16px; font-weight: 500; margin-bottom: 16px; }
        .option-label { display: flex; align-items: center; margin-bottom: 12px; cursor: pointer; font-size: 14px; padding: 8px; border-radius: 4px; transition: background-color 0.2s; }
        .option-label:hover { background-color: #f8f9fa; }
        .option-label input { margin-right: 12px; cursor: pointer; width: 20px; height: 20px; accent-color: #673ab7; }
        .submit-btn { background-color: #673ab7; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; margin-bottom: 40px; transition: background-color 0.2s; display: none; }
        .submit-btn:hover { background-color: #5e35b1; }
        .result-section { display: none; background: #fff; padding: 24px; border-radius: 8px; margin-bottom: 24px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15); text-align: center; }
        .result-section h2 { margin: 0 0 10px 0; font-size: 24px; }
        .explanation-box { display: none; margin-top: 16px; padding: 16px; border-radius: 8px; background-color: #fce8e6; color: #c5221f; font-size: 14px; border-left: 4px solid #c5221f; }
        .explanation-box.correct { background-color: #e6f4ea; color: #137333; border-left: 4px solid #137333; }
        .disabled-form { pointer-events: none; opacity: 0.8; }
        #status-msg { text-align: center; color: #5f6368; padding: 40px; font-size: 18px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="form-container">
    <a href="index.html" class="nav-link">&larr; Back to Portal</a>
    
    <div class="header-card">
        <div class="view-count">Views: <span id="visitor-count">...</span></div>
        <h1 id="quiz-title">Loading Quiz...</h1>
        <p>Attempt as many questions as you'd like and hit submit to view your score and explanations.</p>
    </div>

    <div id="status-msg">Fetching configuration...</div>

    <div id="results" class="result-section">
        <h2>Your Score: <span id="score">0</span> / <span id="total-qs">0</span></h2>
        <p>Scroll down to review the explanations for the questions.</p>
        <button class="submit-btn" onclick="location.reload()" style="display:inline-block; margin-bottom: 0; margin-top: 15px;">Retake Quiz</button>
    </div>

    <form id="quizForm">
        <div id="questions-container"></div>
        <button type="button" class="submit-btn" id="submitBtn" onclick="submitQuiz()">Submit</button>
    </form>
</div>

<script>
    let currentQuizData = [];

    const firebaseConfig = {
      apiKey: "AIzaSyBugi9hxa8hsMZ_MZHUrEguA_k-tMtPtaQ",
      authDomain: "quizportal-d0eff.firebaseapp.com",
      databaseURL: "https://quizportal-d0eff-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quizportal-d0eff",
      storageBucket: "quizportal-d0eff.firebasestorage.app",
      messagingSenderId: "545650564737",
      appId: "1:545650564737:web:feb792a331ce365976f780"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    let quizKey = urlParams.get('quiz_key') || '1';

 // Fetch config to find which quiz to load
    db.ref('configs/index/' + quizKey).once('value')
        .then(snapshot => {
            if (!snapshot.exists()) {
                document.getElementById('quiz-title').innerText = "Quiz Not Found";
                document.getElementById('status-msg').innerText = "Quiz Key does not exist.";
                throw new Error("Invalid Quiz Key"); // Stop execution
            }

            const quizInfo = snapshot.val();
            
            document.getElementById('quiz-title').innerText = quizInfo.title;
            document.getElementById('status-msg').innerText = "Fetching quiz data...";

            // Track view counts
            const countRef = db.ref('quiz_views/quiz_' + quizKey);
            const localKey = 'visited_quiz_' + quizKey;

            if (!localStorage.getItem(localKey)) {
                countRef.set(firebase.database.ServerValue.increment(1));
                localStorage.setItem(localKey, 'true');
            }

            countRef.on('value', (countSnap) => {
                document.getElementById('visitor-count').innerText = countSnap.val() || 0;
            });

            // Clean the ".json" extension off the input_file string to get the Firebase Database Key
            const databaseKey = quizInfo.input_file.replace('.json', '');
            
            // Query the specific quiz from the database
            return db.ref('quizzes/' + databaseKey).once('value');
        })
        .then(snapshot => {
            if (!snapshot || !snapshot.exists()) throw new Error("Quiz data not found in database");
            
            const data = snapshot.val();
            currentQuizData = data;
            
            document.getElementById('status-msg').style.display = 'none';
            document.getElementById('total-qs').innerText = data.length;
            buildQuiz(data);
        })
        .catch(error => {
            if(error.message !== "Invalid Quiz Key") {
                document.getElementById('status-msg').innerText = "Failed to load quiz data from database.";
                console.error(error);
            }
        });

    function buildQuiz(data) {
        const container = document.getElementById('questions-container');
        
        data.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${index}`;

            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = `${index + 1}. ${q.q}`;
            card.appendChild(qText);

            q.options.forEach((opt, optIndex) => {
                const label = document.createElement('label');
                label.className = 'option-label';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `question_${index}`;
                radio.value = optIndex;

                label.appendChild(radio);
                label.appendChild(document.createTextNode(opt));
                card.appendChild(label);
            });

            const expBox = document.createElement('div');
            expBox.className = 'explanation-box';
            expBox.id = `exp-${index}`;
            expBox.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
            card.appendChild(expBox);

            container.appendChild(card);
        });

        document.getElementById('submitBtn').style.display = 'block';
    }

    function submitQuiz() {
        let score = 0;

        currentQuizData.forEach((q, index) => {
            const radios = document.getElementsByName(`question_${index}`);
            let selectedValue = -1;
            
            for (const radio of radios) {
                if (radio.checked) {
                    selectedValue = parseInt(radio.value);
                    break;
                }
            }

            const expBox = document.getElementById(`exp-${index}`);
            expBox.style.display = 'block';

            if (selectedValue === q.answer) {
                score++;
                expBox.classList.add('correct');
                expBox.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
            } else {
                expBox.classList.remove('correct');
                let answerText = q.options[q.answer];
                expBox.innerHTML = `<strong>Incorrect or Unanswered.</strong> The correct answer is: <em>${answerText}</em>.<br><br><strong>Explanation:</strong> ${q.explanation}`;
            }
        });

        document.getElementById('score').innerText = score;
        document.getElementById('results').style.display = 'block';
        
        document.getElementById('questions-container').classList.add('disabled-form');
        document.getElementById('submitBtn').style.display = 'none';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
