<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quiz</title>
        <meta name="description" content="Attempt a quiz and review your results." />
        <link rel="stylesheet" href="css/common.css" />
        <link rel="stylesheet" href="css/quiz.css" />
    </head>
    <body>
        <div class="form-container">
            <a href="index.html" class="nav-link">← Back to Portal</a>
            <div class="header-card">
                <div class="view-count">Views: <span id="visitor-count">...</span></div>
                <h1 id="quiz-title">Loading Quiz...</h1>
                <p>Attempt as many questions as you'd like and hit submit to view your score and explanations.</p>
            </div>
            <div id="status-msg">Fetching configuration...</div>
            <div id="results" class="result-section">
                <h2>Your Score: <span id="score">0</span> / <span id="total-qs">0</span></h2>
                <p>Scroll down to review the explanations for the questions.</p>
                <button class="submit-btn retake-btn" onclick="location.reload()">Retake Quiz</button>
            </div>
            <form id="quizForm">
                <div id="questions-container"></div>
                <button type="button"
                        class="submit-btn"
                        id="submitBtn"
                        onclick="submitQuiz()">Submit</button>
            </form>
        </div>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
        <script src="js/firebase-config.js"></script>
        <script src="js/view-counter.js"></script>
        <script src="js/quiz.js"></script>
    </body>
</html>
