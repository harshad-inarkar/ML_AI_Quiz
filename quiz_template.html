<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-main: #112223;
            --surface: #1a3335;
            --surface-alt: #234244;
            --surface-border: #295355;
            --primary-accent: #4fd1c5;
            --secondary-accent: #319795;
            --text-primary: #f0fdfa;
            --text-secondary: #a1c2c2;
            --green-bg: rgba(72, 187, 120, 0.15);
            --green-text: #68d391;
            --green-border: #48bb78;
            --red-bg: rgba(245, 101, 101, 0.15);
            --red-text: #fc8181;
            --red-border: #f56565;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 24px 20px 48px;
        }

        .form-container { max-width: 640px; margin: 0 auto; }

        .header-card {
            position: relative;
            background-color: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 30px 28px 26px;
            border-radius: 20px;
            margin-bottom: 26px;
            box-shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--secondary-accent), var(--primary-accent));
        }

        .header-card h1 {
            margin: 8px 0 10px 0;
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            padding-right: 70px;
            letter-spacing: -0.02em;
        }

        .header-card p { margin: 0; color: var(--text-secondary); font-size: 14px; }

        .view-count {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 12px;
            color: var(--primary-accent);
            font-weight: 600;
            background: rgba(79, 209, 197, 0.1);
            border: 1px solid var(--surface-border);
            padding: 4px 12px;
            border-radius: 999px;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary-accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .nav-link:hover { color: #fff; }

        .question-card {
            background: var(--surface);
            padding: 22px 24px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--surface-border);
            box-shadow: 0 8px 20px -12px rgba(0, 0, 0, 0.4);
        }

        .question-text {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .option-label {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            transition: background-color 0.15s, border-color 0.15s;
        }
        .option-label:hover { background-color: var(--surface-alt); border-color: var(--surface-border); }

        .option-label input {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--primary-accent);
        }

        .submit-btn {
            background: linear-gradient(120deg, var(--secondary-accent), var(--primary-accent));
            color: #0b1a1b;
            border: none;
            padding: 11px 26px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 40px;
            transition: opacity 0.2s;
            display: none;
        }
        .submit-btn:hover { opacity: 0.9; }

        .result-section {
            display: none;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 28px;
            border-radius: 20px;
            margin-bottom: 26px;
            box-shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .result-section h2 {
            margin: 0 0 10px 0;
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            color: var(--text-primary);
        }

        .result-section p { color: var(--text-secondary); font-size: 14px; }

        .explanation-box {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            border-radius: 10px;
            background-color: var(--red-bg);
            color: var(--red-text);
            font-size: 14px;
            border-left: 4px solid var(--red-border);
        }
        .explanation-box.correct {
            background-color: var(--green-bg);
            color: var(--green-text);
            border-left: 4px solid var(--green-border);
        }

        .disabled-form { pointer-events: none; opacity: 0.85; }

        #status-msg { text-align: center; color: var(--text-secondary); padding: 40px; font-size: 17px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="form-container">
    <a href="index.html" class="nav-link">&larr; Back to Portal</a>
    
    <div class="header-card">
        <div class="view-count">Views: <span id="visitor-count">...</span></div>
        <h1 id="quiz-title">Loading Quiz...</h1>
        <p>Attempt as many questions as you'd like and hit submit to view your score and explanations.</p>
    </div>

    <div id="status-msg">Fetching configuration...</div>

    <div id="results" class="result-section">
        <h2>Your Score: <span id="score">0</span> / <span id="total-qs">0</span></h2>
        <p>Scroll down to review the explanations for the questions.</p>
        <button class="submit-btn" onclick="location.reload()" style="display:inline-block; margin-bottom: 0; margin-top: 15px;">Retake Quiz</button>
    </div>

    <form id="quizForm">
        <div id="questions-container"></div>
        <button type="button" class="submit-btn" id="submitBtn" onclick="submitQuiz()">Submit</button>
    </form>
</div>

<script>
    let currentQuizData = [];

    const firebaseConfig = {
      apiKey: "AIzaSyBugi9hxa8hsMZ_MZHUrEguA_k-tMtPtaQ",
      authDomain: "quizportal-d0eff.firebaseapp.com",
      databaseURL: "https://quizportal-d0eff-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quizportal-d0eff",
      storageBucket: "quizportal-d0eff.firebasestorage.app",
      messagingSenderId: "545650564737",
      appId: "1:545650564737:web:feb792a331ce365976f780"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    let quizKey = urlParams.get('quiz_key') || '1';

 // Fetch config to find which quiz to load
    db.ref('configs/index/' + quizKey).once('value')
        .then(snapshot => {
            if (!snapshot.exists()) {
                document.getElementById('quiz-title').innerText = "Quiz Not Found";
                document.getElementById('status-msg').innerText = "Quiz Key does not exist.";
                throw new Error("Invalid Quiz Key"); // Stop execution
            }

            const quizInfo = snapshot.val();
            
            document.getElementById('quiz-title').innerText = quizInfo.title;
            document.getElementById('status-msg').innerText = "Fetching quiz data...";

            // Track view counts
            const countRef = db.ref('quiz_views/quiz_' + quizKey);
            const localKey = 'visited_quiz_' + quizKey;

            if (!localStorage.getItem(localKey)) {
                countRef.set(firebase.database.ServerValue.increment(1));
                localStorage.setItem(localKey, 'true');
            }

            countRef.on('value', (countSnap) => {
                document.getElementById('visitor-count').innerText = countSnap.val() || 0;
            });

            // Clean the ".json" extension off the input_file string to get the Firebase Database Key
            const databaseKey = quizInfo.input_file.replace('.json', '');
            
            // Query the specific quiz from the database
            return db.ref('quizzes/' + databaseKey).once('value');
        })
        .then(snapshot => {
            if (!snapshot || !snapshot.exists()) throw new Error("Quiz data not found in database");
            
            const data = snapshot.val();
            currentQuizData = data;
            
            document.getElementById('status-msg').style.display = 'none';
            document.getElementById('total-qs').innerText = data.length;
            buildQuiz(data);
        })
        .catch(error => {
            if(error.message !== "Invalid Quiz Key") {
                document.getElementById('status-msg').innerText = "Failed to load quiz data from database.";
                console.error(error);
            }
        });

    function buildQuiz(data) {
        const container = document.getElementById('questions-container');
        
        data.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${index}`;

            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = `${index + 1}. ${q.q}`;
            card.appendChild(qText);

            q.options.forEach((opt, optIndex) => {
                const label = document.createElement('label');
                label.className = 'option-label';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `question_${index}`;
                radio.value = optIndex;

                label.appendChild(radio);
                label.appendChild(document.createTextNode(opt));
                card.appendChild(label);
            });

            const expBox = document.createElement('div');
            expBox.className = 'explanation-box';
            expBox.id = `exp-${index}`;
            expBox.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
            card.appendChild(expBox);

            container.appendChild(card);
        });

        document.getElementById('submitBtn').style.display = 'block';
    }

    function submitQuiz() {
        let score = 0;

        currentQuizData.forEach((q, index) => {
            const radios = document.getElementsByName(`question_${index}`);
            let selectedValue = -1;
            
            for (const radio of radios) {
                if (radio.checked) {
                    selectedValue = parseInt(radio.value);
                    break;
                }
            }

            const expBox = document.getElementById(`exp-${index}`);
            expBox.style.display = 'block';

            if (selectedValue === q.answer) {
                score++;
                expBox.classList.add('correct');
                expBox.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
            } else {
                expBox.classList.remove('correct');
                let answerText = q.options[q.answer];
                expBox.innerHTML = `<strong>Incorrect or Unanswered.</strong> The correct answer is: <em>${answerText}</em>.<br><br><strong>Explanation:</strong> ${q.explanation}`;
            }
        });

        document.getElementById('score').innerText = score;
        document.getElementById('results').style.display = 'block';
        
        document.getElementById('questions-container').classList.add('disabled-form');
        document.getElementById('submitBtn').style.display = 'none';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
