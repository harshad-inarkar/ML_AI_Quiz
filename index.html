<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quiz Portal</title>
        <meta name="description" content="Browse and attempt available quizzes." />
        <link rel="stylesheet" href="css/common.css" />
        <link rel="stylesheet" href="css/portal.css" />
    </head>
    <body class="page-shell portal-page">
        <div class="page-content portal-container">

            </div>

        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

        <script src="js/firebase-config.js"></script>
        <script src="js/app-check.js"></script>
        <script src="js/view-counter.js"></script>
        <script src="js/app-bootstrap.js"></script>
        <script src="js/portal.js"></script>

</html>
