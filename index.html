<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-900: #03181a;
            --surface: #0a3033;
            --surface-border: #144e50;
            --turquoise: #2dd4bf;
            --turquoise-soft: #5eead4;
            --peacock: #0ea5b7;
            --teal-mid: #0d9488;
            --text-primary: #eafffb;
            --text-secondary: #8fb8b4;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: radial-gradient(circle at 15% 0%, #0b3d3f 0%, var(--bg-900) 55%, #010e0f 100%);
            color: var(--text-primary);
            margin: 0;
            padding: 48px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .portal-container { max-width: 640px; width: 100%; }

        .header-card {
            position: relative;
            background-color: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 36px 32px 32px;
            border-radius: 20px;
            margin-bottom: 32px;
            box-shadow: 0 0 0 1px rgba(45, 212, 191, 0.04), 0 20px 45px -20px rgba(0, 0, 0, 0.6);
            text-align: center;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--teal-mid), var(--turquoise), var(--peacock));
        }

        .header-card h1 {
            margin: 8px 0 10px 0;
            font-family: 'Poppins', sans-serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .header-card p {
            margin: 0 0 20px 0;
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.55;
        }

        .view-count {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 12px;
            color: var(--turquoise-soft);
            font-weight: 600;
            background: rgba(45, 212, 191, 0.08);
            border: 1px solid var(--surface-border);
            padding: 4px 12px;
            border-radius: 999px;
        }

        .quiz-card {
            background: var(--surface);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 18px;
            border: 1px solid var(--surface-border);
            border-left: 4px solid var(--turquoise);
            box-shadow: 0 12px 30px -18px rgba(0, 0, 0, 0.7);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .quiz-card:hover {
            transform: translateY(-2px);
            border-color: var(--turquoise);
            box-shadow: 0 16px 34px -16px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(45, 212, 191, 0.15);
        }

        .quiz-card h2 {
            margin: 0 0 8px 0;
            font-family: 'Poppins', sans-serif;
            font-size: 19px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .quiz-card p {
            margin: 0 0 18px 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .action-links { display: flex; gap: 12px; flex-wrap: wrap; }

        .btn {
            padding: 9px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        .btn-primary {
            background: linear-gradient(120deg, var(--teal-mid), var(--peacock));
            color: #04191a;
            border: 1px solid transparent;
        }
        .btn-primary:hover { background: linear-gradient(120deg, var(--turquoise), var(--peacock)); }

        .btn-secondary {
            background-color: transparent;
            color: var(--turquoise-soft);
            border: 1px solid var(--surface-border);
        }
        .btn-secondary:hover { background-color: rgba(45, 212, 191, 0.08); border-color: var(--turquoise); }

        #loading { text-align: center; color: var(--text-secondary); }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="portal-container">
    <div class="header-card">
        <div class="view-count">Views: <span id="portal-visitor-count">...</span></div>
        <h1>Quiz Portal</h1>
        <p>Select a quiz below to test your knowledge.</p>
        <a href="resources_template.html" class="btn btn-secondary">View All Study Resources</a>
    </div>

    <div id="quiz-list">
        <p id="loading">Loading quizzes...</p>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBugi9hxa8hsMZ_MZHUrEguA_k-tMtPtaQ",
      authDomain: "quizportal-d0eff.firebaseapp.com",
      databaseURL: "https://quizportal-d0eff-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quizportal-d0eff",
      storageBucket: "quizportal-d0eff.firebasestorage.app",
      messagingSenderId: "545650564737",
      appId: "1:545650564737:web:feb792a331ce365976f780"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const portalCountRef = db.ref('portal_views/main');
    const localPortalKey = 'visited_portal_main';

    if (!localStorage.getItem(localPortalKey)) {
        portalCountRef.set(firebase.database.ServerValue.increment(1));
        localStorage.setItem(localPortalKey, 'true');
    }

    portalCountRef.on('value', (snapshot) => {
        document.getElementById('portal-visitor-count').innerText = snapshot.val() || 0;
    });

    /// Fetch config directly from Firebase
    db.ref('configs/index').once('value')
        .then((snapshot) => {
            if (!snapshot.exists()) throw new Error("Config not found in Firebase");
            const data = snapshot.val();
            
            const listContainer = document.getElementById('quiz-list');
            listContainer.innerHTML = ''; 

            const sortedKeys = Object.keys(data).sort((a, b) => parseInt(a) - parseInt(b));

            sortedKeys.forEach(key => {
                const quizData = data[key];
                const card = document.createElement('div');
                card.className = 'quiz-card';
                
                let resourceBtnHtml = '';
                if (quizData.resources_keys && quizData.resources_keys.length > 0) {
                    const keysQuery = quizData.resources_keys.join(',');
                    resourceBtnHtml = `<a href="resources_template.html?keys=${encodeURIComponent(keysQuery)}" class="btn btn-secondary">Study Resources</a>`;
                }
                
                card.innerHTML = `
                    <h2>${quizData.title}</h2>
                    <p>Click below to attempt the quiz or view associated resources.</p>
                    <div class="action-links">
                        <a href="quiz_template.html?quiz_key=${encodeURIComponent(key)}" class="btn btn-primary">Attempt Quiz</a>
                        ${resourceBtnHtml}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        })
        .catch(error => {
            document.getElementById('loading').innerText = "Error loading quizzes from database.";
            console.error("Error:", error);
        });
</script>

</body>
</html>
