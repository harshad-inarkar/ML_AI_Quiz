<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quiz Portal</title>
        <meta name="description" content="Browse and attempt available quizzes." />
        <link rel="stylesheet" href="css/common.css" />
        <link rel="stylesheet" href="css/portal.css" />
    </head>
    <body class="page-shell portal-page">
        <!-- QUIZ MODAL -->
        <div id="quiz-modal" class="modal-overlay">
            <div class="modal-content">
                <h2 id="quiz-modal-title">Add New Quiz</h2>
                <input type="hidden" id="quiz-edit-key">
                <div class="form-group"><label>Quiz Title</label><input type="text" id="cms-quiz-title" placeholder="e.g. Quiz 5: Advanced CNNs"></div>
                <div class="form-group"><label>Resources Keys (Comma separated)</label><input type="text" id="cms-quiz-resources" placeholder="e.g. 1, 4, 7"></div>
                <div class="form-group"><label>Quiz JSON Data File <span id="cms-json-hint" style="color:var(--secondary-accent);"></span></label><input type="file" id="cms-quiz-file" accept=".json"></div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="document.getElementById('quiz-modal').style.display='none'">Cancel</button>
                    <button class="btn btn-primary" id="save-quiz-btn">Save Quiz</button>
                </div>
            </div>
        </div>

        <!-- NEW: SETTINGS MODAL -->
        <div id="settings-modal" class="modal-overlay">
            <div class="modal-content">
                <h2>Portal Settings</h2>
                <div class="form-group">
                    <label>Quiz Access Level</label>
                    <select id="cms-quiz-access">
                        <option value="unrestricted">Unrestricted (Public)</option>
                        <option value="enforce_register">Require Login</option>
                        <option value="enforce_verify_email">Require Verified Email</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Resources Access Level</label>
                    <select id="cms-res-access">
                        <option value="unrestricted">Unrestricted (Public)</option>
                        <option value="enforce_register">Require Login</option>
                        <option value="enforce_verify_email">Require Verified Email</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="document.getElementById('settings-modal').style.display='none'">Cancel</button>
                    <button class="btn btn-primary" onclick="window.portalApp.saveSettings()">Save Settings</button>
                </div>
            </div>
        </div>

        <div class="page-content portal-container">
            <!-- Top Nav Area -->
            <div class="top-nav-bar" style="justify-content: flex-end;">
                <div class="auth-area">
                    <div class="auth-info" id="auth-status">Checking session...</div>
                    <div id="auth-actions"></div>
                </div>
            </div>

            <div class="header-card">
                <div class="view-count">Views: <span id="portal-visitor-count">...</span> &nbsp;|&nbsp; Downloads: <span id="portal-download-count">0</span></div>
                <h1>Quiz Portal</h1>
                <p>Select a quiz below to test your knowledge.<br>

                <span id="guest-promo-text" class="guest-promo-msg">
                    <a href="javascript:void(0)" onclick="document.getElementById('auth-modal').style.display='flex'">Register/Log in</a> to save your top score, resume your quiz, and track progress.
                </span>
                
                </p>

                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <a href="resources_template.html" class="btn btn-secondary">View All Study Resources</a>
                    <!-- Admin Only Buttons -->
                    <button class="btn btn-primary admin-only" onclick="window.portalApp.openQuizModal()">+ Add New Quiz</button>
                    <button class="btn btn-secondary admin-only" onclick="window.portalApp.openSettingsModal()">Portal Settings</button>
                </div>
            </div>
            <div id="quiz-list"><p id="loading">Loading quizzes...</p></div>
        </div>

        <!-- Scripts -->
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
        <script src="js/firebase-config.js"></script>
        <script src="js/app-check.js"></script>
        <script src="js/view-counter.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/app-bootstrap.js"></script>
        <script src="js/cleanup.js"></script>
        <script src="js/portal.js"></script>

        <!-- Toggle Guest Promo Text -->
        <script>
            document.addEventListener('auth-resolved', () => {
                const promoText = document.getElementById('guest-promo-text');
                if (promoText) {
                    promoText.style.display = (window.authManager && window.authManager.userProfile) ? 'none' : 'inline';
                }
            });
        </script>
    </body>
</html>
