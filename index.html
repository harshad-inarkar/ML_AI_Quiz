<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { font-family: 'Roboto', Arial, sans-serif; background-color: #f0ebf8; color: #202124; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .portal-container { max-width: 640px; width: 100%; }
        .header-card { position: relative; background-color: #fff; border-top: 10px solid #673ab7; padding: 32px; border-radius: 8px; margin-bottom: 32px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15); text-align: center; }
        .header-card h1 { margin: 0 0 12px 0; font-size: 32px; font-weight: 400; }
        .header-card p { margin: 0 0 16px 0; color: #5f6368; font-size: 16px; line-height: 1.5; }
        .view-count { position: absolute; top: 12px; right: 16px; font-size: 12px; color: #5f6368; font-weight: 500; }
        
        .quiz-card { background: #fff; padding: 24px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15); border-left: 8px solid #673ab7; }
        .quiz-card h2 { margin: 0 0 8px 0; font-size: 20px; color: #202124; font-weight: 500; }
        .quiz-card p { margin: 0 0 16px 0; color: #5f6368; font-size: 14px; }
        
        .action-links { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn { padding: 8px 16px; border-radius: 4px; text-decoration: none; font-size: 14px; font-weight: 500; transition: background-color 0.2s; }
        .btn-primary { background-color: #673ab7; color: white; border: 1px solid #673ab7; }
        .btn-primary:hover { background-color: #5e35b1; }
        .btn-secondary { background-color: #f0ebf8; color: #673ab7; border: 1px solid #d1c4e9; }
        .btn-secondary:hover { background-color: #e4d8f1; }
        
        #loading { text-align: center; color: #5f6368; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="portal-container">
    <div class="header-card">
        <div class="view-count">Views: <span id="portal-visitor-count">...</span></div>
        <h1>Quiz Portal</h1>
        <p>Select a quiz below to test your knowledge.</p>
        <a href="resources_template.html" class="btn btn-secondary">View All Study Resources</a>
    </div>

    <div id="quiz-list">
        <p id="loading">Loading quizzes...</p>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBugi9hxa8hsMZ_MZHUrEguA_k-tMtPtaQ",
      authDomain: "quizportal-d0eff.firebaseapp.com",
      databaseURL: "https://quizportal-d0eff-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quizportal-d0eff",
      storageBucket: "quizportal-d0eff.firebasestorage.app",
      messagingSenderId: "545650564737",
      appId: "1:545650564737:web:feb792a331ce365976f780"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const portalCountRef = db.ref('portal_views/main');
    const localPortalKey = 'visited_portal_main';

    if (!localStorage.getItem(localPortalKey)) {
        portalCountRef.set(firebase.database.ServerValue.increment(1));
        localStorage.setItem(localPortalKey, 'true');
    }

    portalCountRef.on('value', (snapshot) => {
        document.getElementById('portal-visitor-count').innerText = snapshot.val() || 0;
    });

    /// Fetch config directly from Firebase
    db.ref('configs/index').once('value')
        .then((snapshot) => {
            if (!snapshot.exists()) throw new Error("Config not found in Firebase");
            const data = snapshot.val();
            
            const listContainer = document.getElementById('quiz-list');
            listContainer.innerHTML = ''; 

            const sortedKeys = Object.keys(data).sort((a, b) => parseInt(a) - parseInt(b));

            sortedKeys.forEach(key => {
                const quizData = data[key];
                const card = document.createElement('div');
                card.className = 'quiz-card';
                
                let resourceBtnHtml = '';
                if (quizData.resources_keys && quizData.resources_keys.length > 0) {
                    const keysQuery = quizData.resources_keys.join(',');
                    resourceBtnHtml = `<a href="resources_template.html?keys=${encodeURIComponent(keysQuery)}" class="btn btn-secondary">Study Resources</a>`;
                }
                
                card.innerHTML = `
                    <h2>${quizData.title}</h2>
                    <p>Click below to attempt the quiz or view associated resources.</p>
                    <div class="action-links">
                        <a href="quiz_template.html?quiz_key=${encodeURIComponent(key)}" class="btn btn-primary">Attempt Quiz</a>
                        ${resourceBtnHtml}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        })
        .catch(error => {
            document.getElementById('loading').innerText = "Error loading quizzes from database.";
            console.error("Error:", error);
        });
</script>

</body>
</html>
