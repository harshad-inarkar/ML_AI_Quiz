<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quiz Portal</title>
        <meta name="description" content="Browse and attempt available quizzes." />
        <link rel="stylesheet" href="css/common.css" />
        <link rel="stylesheet" href="css/portal.css" />
    </head>
    <body class="page-shell portal-page">
        <!-- Auth & Admin Modals -->
        <div id="auth-modal" class="modal-overlay">
            <div class="modal-content">
                <h2>Login / Register</h2>
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 20px;">Enter your details. A passwordless login link will be sent to your email.</p>
                <div class="form-group"><label>Desired Username (New Users Only)</label><input type="text" id="auth-username" placeholder="e.g. JohnDoe"></div>
                <div class="form-group"><label>Email Address *</label><input type="email" id="auth-email" placeholder="you@email.com"></div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="document.getElementById('auth-modal').style.display='none'">Cancel</button>
                    <button class="btn btn-primary" onclick="window.authManager.sendLoginLink(document.getElementById('auth-email').value, document.getElementById('auth-username').value)">Send Link</button>
                </div>
            </div>
        </div>

        <div id="quiz-modal" class="modal-overlay">
            <div class="modal-content">
                <h2 id="quiz-modal-title">Add New Quiz</h2>
                <input type="hidden" id="quiz-edit-key">
                <div class="form-group"><label>Quiz Title</label><input type="text" id="cms-quiz-title" placeholder="e.g. Quiz 5: Advanced CNNs"></div>
                <div class="form-group"><label>Resources Keys (Comma separated)</label><input type="text" id="cms-quiz-resources" placeholder="e.g. 1, 4, 7"></div>
                <div class="form-group"><label>Quiz JSON Data File <span id="cms-json-hint" style="color:var(--secondary-accent);"></span></label><input type="file" id="cms-quiz-file" accept=".json"></div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="document.getElementById('quiz-modal').style.display='none'">Cancel</button>
                    <button class="btn btn-primary" id="save-quiz-btn">Save Quiz</button>
                </div>
            </div>
        </div>

        <div class="page-content portal-container">
            <!-- Auth Bar -->
            <div class="auth-bar">
                <div class="auth-info" id="auth-status">Checking session...</div>
                <div id="auth-actions"></div>
            </div>

            <div class="header-card">
                <div class="view-count">Views: <span id="portal-visitor-count">...</span> &nbsp;|&nbsp; Downloads: <span id="portal-download-count">0</span></div>
                <h1>Quiz Portal</h1>
                <p>Select a quiz below to test your knowledge.</p>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <a href="resources_template.html" class="btn btn-secondary">View All Study Resources</a>
                    <!-- Admin Only Add Button -->
                    <button class="btn btn-primary admin-only" onclick="window.portalApp.openQuizModal()">+ Add New Quiz</button>
                </div>
            </div>
            <div id="quiz-list"><p id="loading">Loading quizzes...</p></div>
        </div>

        <!-- Scripts -->
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
        <script src="js/firebase-config.js"></script>
        <script src="js/app-check.js"></script>
        <script src="js/view-counter.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/app-bootstrap.js"></script>
        <script src="js/portal.js"></script>
    </body>
</html>
